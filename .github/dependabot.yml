#
# Dependabot has no CMake FetchContent ecosystem, so the nlohmann/json,
# GoogleTest and Google Benchmark pins in the CMake files are checked
# against OSV by scripts/osv-check.py (.github/workflows/osv.yml) and
# bumped by hand. It does track the workflow actions and the
# hash-pinned MkDocs requirements the manual builds with.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci/cd"
      - "automated"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
