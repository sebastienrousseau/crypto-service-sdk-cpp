name: Bug Report
description: Report a reproducible problem in crypto-service-sdk-cpp
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Use synthetic values only: no real keys,
        plaintexts, tokens or API keys. Report security problems
        privately, as SECURITY.md describes.
  - type: input
    id: version
    attributes:
      label: SDK version or commit
      placeholder: "0.0.40"
    validations:
      required: true
  - type: input
    id: server_version
    attributes:
      label: crypto-server version or commit (GET /)
      placeholder: "3e8ecfd"
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Compiler, CMake and libcurl versions
      placeholder: "g++ 13.3, CMake 3.28, libcurl 8.5.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal Reproducible Example
      render: cpp
    validations:
      required: true
  - type: textarea
    id: error_output
    attributes:
      label: Error Output
      description: The exception type, ApiError::status() and problem().type, or compiler output.
    validations:
      required: true
